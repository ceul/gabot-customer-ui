name: Customer UI CI/CD

on:
  push:
    branches: [master, dev]

env:
  IMAGE: ghcr.io/ceul/gabot-customer-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run test:run

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "value=${{ env.IMAGE }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ env.IMAGE }}:dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.value }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DEPLOY_TAG,BRANCH
          script: |
            cd /opt/gabot
            docker pull "$DEPLOY_TAG"
            if [ "$BRANCH" = "master" ]; then
              docker compose --profile prod up -d --no-deps customer-ui-prod
            else
              docker compose --profile dev up -d --no-deps customer-ui-dev
            fi
        env:
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
